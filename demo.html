<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vibe</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: monospace;
            background: #fff;
            color: #000;
            line-height: 1.4;
            padding: 1rem;
        }

        h1 {
            font-size: 1rem;
            font-weight: normal;
            margin-bottom: 1rem;
        }

        nav {
            margin-bottom: 2rem;
        }

        nav a {
            color: #000;
            text-decoration: underline;
            margin-right: 1rem;
        }

        .demo {
            margin-bottom: 2rem;
            border-top: 1px solid #000;
            padding-top: 1rem;
        }

        h2 {
            font-size: 1rem;
            font-weight: normal;
            margin-bottom: 0.5rem;
        }

        button {
            background: #000;
            color: #fff;
            border: none;
            padding: 0.5rem;
            cursor: pointer;
            font-family: monospace;
            font-size: 0.9rem;
        }

        button:hover {
            background: #333;
        }

        input {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid #000;
            font-family: monospace;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }

        .output {
            margin-top: 0.5rem;
            padding: 0.5rem;
            border: 1px solid #000;
            display: none;
            font-size: 0.85rem;
        }

        .output.show {
            display: block;
        }

        .color-box {
            width: 100%;
            height: 40px;
            margin-bottom: 0.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
        }

        .vibe-log {
            margin-top: 0.5rem;
            padding: 0.5rem;
            border: 1px solid #000;
            max-height: 200px;
            overflow-y: auto;
        }

        .vibe-entry {
            padding: 0.5rem;
            margin-bottom: 0.5rem;
            border-left: 2px solid #000;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <h1>vibe</h1>
    <nav>
        <a href="#quotes">quotes</a>
        <a href="#colors">colors</a>
        <a href="#tracker">tracker</a>
        <a href="#ideas">ideas</a>
    </nav>

    <div class="demo" id="quotes">
        <h2>quotes</h2>
        <button onclick="generateQuote()">generate</button>
        <div id="quote-output" class="output"></div>
    </div>

    <div class="demo" id="colors">
        <h2>colors</h2>
        <button onclick="generateColors()">generate</button>
        <div id="color-output" class="output"></div>
    </div>

    <div class="demo" id="tracker">
        <h2>tracker</h2>
        <input type="text" id="project-name" placeholder="name">
        <input type="text" id="project-desc" placeholder="description">
        <button onclick="logVibe()">log</button>
        <div id="vibe-log" class="vibe-log" style="display:none;"></div>
    </div>

    <div class="demo" id="ideas">
        <h2>ideas</h2>
        <button onclick="vibeCheck()">generate</button>
        <div id="vibe-output" class="output"></div>
    </div>

    <script>
        // Quote Machine
        const quotes = [
            { text: "Code anything.", author: "The Vibe" },
            { text: "Perfect is the enemy of shipped.", author: "Voltaire (paraphrased)" },
            { text: "Your first draft is supposed to suck.", author: "Everyone Eventually" },
            { text: "Start messy. Refactor never (jk, maybe later).", author: "Vibe Coders" },
            { text: "If it works, it works.", author: "Ancient Dev Proverb" },
            { text: "Build it now, name it later.", author: "README-less Projects" },
            { text: "You don't need permission to create.", author: "You" },
            { text: "Every expert was once a beginner who didn't quit.", author: "Anonymous" },
            { text: "The best time to start was yesterday. The second best time is now.", author: "Also Anonymous" },
            { text: "Make it work, make it right, make it fast. In that order.", author: "Kent Beck" }
        ];

        function generateQuote() {
            const quote = quotes[Math.floor(Math.random() * quotes.length)];
            const output = document.getElementById('quote-output');
            output.textContent = `"${quote.text}" - ${quote.author}`;
            output.classList.add('show');
        }

        // Color Generator
        function generateColors() {
            const output = document.getElementById('color-output');
            let html = '';

            for (let i = 0; i < 5; i++) {
                const color = '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6, '0');
                html += `<div class="color-box" style="background:${color}">${color}</div>`;
            }

            output.innerHTML = html;
            output.classList.add('show');
        }

        // Vibe Tracker
        let vibes = JSON.parse(localStorage.getItem('vibes') || '[]');

        function logVibe() {
            const projectName = document.getElementById('project-name').value.trim();
            const projectDesc = document.getElementById('project-desc').value.trim();

            if (!projectName || !projectDesc) {
                alert('Fill in both fields to log your vibe!');
                return;
            }

            const vibe = {
                project: projectName,
                description: projectDesc,
                timestamp: new Date().toLocaleString()
            };

            vibes.unshift(vibe);
            localStorage.setItem('vibes', JSON.stringify(vibes));

            document.getElementById('project-name').value = '';
            document.getElementById('project-desc').value = '';

            displayVibes();
        }

        function displayVibes() {
            const log = document.getElementById('vibe-log');

            if (vibes.length === 0) {
                log.style.display = 'none';
                return;
            }

            log.style.display = 'block';
            log.innerHTML = vibes.slice(0, 10).map(vibe => `
                <div class="vibe-entry">
                    ${vibe.project}: ${vibe.description}<br>
                    ${vibe.timestamp}
                </div>
            `).join('');
        }

        // Project Idea Generator
        const projectIdeas = {
            energized: [
                { name: "Real-time Chat App", desc: "Build a WebSocket chat with rooms and emojis" },
                { name: "Multiplayer Game", desc: "Simple browser game like Snake or Pong" },
                { name: "Live Dashboard", desc: "Real-time data visualization with charts" }
            ],
            chill: [
                { name: "Markdown Blog", desc: "Static site generator from .md files" },
                { name: "Pomodoro Timer", desc: "Focus timer with ambient sounds" },
                { name: "Recipe Organizer", desc: "Save and search your favorite recipes" }
            ],
            creative: [
                { name: "ASCII Art Generator", desc: "Turn images into ASCII art" },
                { name: "Random Color Palette", desc: "Generate beautiful color schemes" },
                { name: "Generative Art", desc: "Canvas-based artwork that changes" }
            ],
            practical: [
                { name: "File Organizer", desc: "Auto-sort downloads by type" },
                { name: "Expense Tracker", desc: "Log spending and see totals" },
                { name: "Link Shortener", desc: "Create and track short URLs" }
            ]
        };

        function vibeCheck() {
            const vibes = Object.keys(projectIdeas);
            const randomVibe = vibes[Math.floor(Math.random() * vibes.length)];
            const projects = projectIdeas[randomVibe];
            const project = projects[Math.floor(Math.random() * projects.length)];

            const output = document.getElementById('vibe-output');
            output.textContent = `${project.name}: ${project.desc}`;
            output.classList.add('show');
        }

        // Load vibes on page load
        displayVibes();
    </script>
</body>
</html>
